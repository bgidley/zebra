stages:
  - lint
  - test
  - e2e
  - deploy
  - smoke
  - release

# Every job runs on the single prod host (OCI A1, `coding-agent`) via a GitLab
# shell runner executing as `opc` — see deploy/podman/bootstrap-host.sh.
default:
  tags:
    - opc-shell
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --all-packages --frozen

variables:
  DJANGO_SETTINGS_MODULE: zebra_agent_web.settings

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

# Build the stylesheet on every pipeline so a broken app.css never first fails
# in the master-only Docker build.
css:
  stage: lint
  script:
    - uv run python scripts/build_css.py
    - test -s zebra-agent-web/static/css/app.css
    - grep -q -- "--color-voice" zebra-agent-web/static/css/app.css

unit:
  stage: test
  script:
    - uv run pytest -m "not e2e and not smoke" --ignore=zebra-agent-web/tests/e2e_live --ignore=zebra-agent-web/tests/smoke --ds=zebra_agent_web.test_settings

e2e:
  stage: e2e
  # Auto-recover transient ADB connection drops (e.g. DPY-4011). The per-pipeline
  # schema is dropped in after_script and re-created (drop-if-exists) on retry.
  retry: 2
  # One Oracle e2e at a time: the Always Free ADB caps sessions at 30, shared
  # with prod (#169).
  resource_group: oracle-e2e
  script:
    # Per-job workflow library. The shell runner shares $HOME across branches, so
    # the default ~/.zebra/workflows would let one branch's newer built-in YAML
    # (copied only on version bump) leak into another branch's e2e run.
    - export ZEBRA_LIBRARY_PATH="$CI_PROJECT_DIR/.ci-workflows" && rm -rf "$ZEBRA_LIBRARY_PATH"
    # E2E_PROVISIONER_* are GitLab CI variables (set in project settings).
    - |
      if [ -n "$E2E_PROVISIONER_DSN" ] && [ -n "$E2E_PROVISIONER_USERNAME" ] && [ -n "$E2E_PROVISIONER_PASSWORD" ]; then
        # Per-pipeline ephemeral Oracle schema — real prod parity, fully isolated.
        export E2E_SCHEMA="E2E_$(printf '%s' "$CI_COMMIT_REF_SLUG" | tr 'a-z-' 'A-Z_' | tr -cd 'A-Z0-9_' | cut -c1-8)_${CI_PIPELINE_ID}"
        # Generate the schema password in-shell (never written to a file or logged);
        # reuse the same value for ORACLE_PASSWORD below.
        export E2E_SCHEMA_PASSWORD="Az9$(openssl rand -hex 13)"
        echo "Provisioning ephemeral Oracle schema $E2E_SCHEMA"
        uv run python scripts/e2e_oracle_schema.py create --schema "$E2E_SCHEMA"
        export ORACLE_DSN="$E2E_PROVISIONER_DSN"
        export ORACLE_USERNAME="$E2E_SCHEMA"
        export ORACLE_PASSWORD="$E2E_SCHEMA_PASSWORD"
        uv run python zebra-agent-web/manage.py migrate --noinput
        # In-database embedding model for vector memory search (#169).
        uv run python zebra-agent-web/manage.py load_embedding_model --strict
        uv run pytest zebra-agent-web/tests/e2e/ -m e2e
      else
        # Fallback (no provisioner creds): SQLite.
        echo "E2E_PROVISIONER_* not set — falling back to SQLite e2e"
        uv run pytest zebra-agent-web/tests/e2e/ -m e2e --ds=zebra_agent_web.e2e_settings
      fi
  after_script:
    # Always drop the ephemeral schema (after_script runs even on failure/cancel).
    # E2E_PROVISIONER_* come from CI variables — available in after_script too.
    - |
      if [ -n "$E2E_PROVISIONER_DSN" ]; then
        SCHEMA="E2E_$(printf '%s' "$CI_COMMIT_REF_SLUG" | tr 'a-z-' 'A-Z_' | tr -cd 'A-Z0-9_' | cut -c1-8)_${CI_PIPELINE_ID}"
        echo "Dropping ephemeral Oracle schema $SCHEMA"
        uv run python scripts/e2e_oracle_schema.py drop --schema "$SCHEMA" || true
      fi

e2e-live:
  stage: e2e
  script:
    # ORACLE_* / OPENROUTER_API_KEY arrive as GitLab CI variables.
    - VCR_RECORD_MODE=none uv run pytest zebra-agent-web/tests/e2e_live/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

deploy:
  stage: deploy
  script:
    # Bake git version metadata into the image at build time (git not in container)
    - uv run python scripts/gen_version.py > version.json
    # Builds localhost/zebra-web:$SHA, writes ~/.config/zebra/prod.env from the CI
    # variables, swaps the Quadlet units to the new image (health-gated, auto-rollback).
    - bash scripts/deploy-podman.sh "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"
  resource_group: zebra-prod

smoke:
  stage: smoke
  script:
    # Login is passkey-only: mint a 15-minute session for the smoke user so the
    # logged-in page checks (dashboard, /tasks/, budget) run instead of skipping (#218).
    - ZEBRA_SMOKE_SESSION="$(podman exec zebra-web python zebra-agent-web/manage.py smoke_session)"
    - export ZEBRA_SMOKE_SESSION
    - uv run pytest zebra-agent-web/tests/smoke/ -v -m smoke
  variables:
    SMOKE_BASE_URL: "http://localhost:8000"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

# Cut a release (#283): manual, master push pipelines only, and in the last stage, so it can
# only be started once lint, tests, deploy and smoke are green. Creates the GitLab release and
# the vX.Y.Z tag at this commit (refused if master has moved on), with notes listing the issues
# closed since the last tag. Set RELEASE_BUMP (major/minor/patch, default minor) or
# RELEASE_VERSION when running it. Needs the masked, protected RELEASE_GITLAB_TOKEN.
# allow_failure keeps the master pipeline green while nobody runs it.
release:tag:
  stage: release
  script:
    - uv run python scripts/release_tag.py --ref "$CI_COMMIT_SHA" --notes-file release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
  resource_group: zebra-release

# Release manifests (#283 R3). Tag pipelines only, and only once the release bucket and the
# cosign key are configured, so branch and master pipelines never see these jobs. RELEASE_IMAGE
# (registry/repo@sha256:...) comes from the image publish job (R2, not built yet) as a dotenv
# artifact; until then release:manifest stops with a clear message. See
# specs/release-pipeline-design.md for the variables and the bucket layout.
.release-manifest:
  stage: release
  variables:
    RELEASE_PUBKEY: deploy/release/cosign.pub
  resource_group: zebra-release

release:manifest:
  extends: .release-manifest
  script:
    - test -n "$RELEASE_IMAGE" || { echo "RELEASE_IMAGE is not set (publish the image first)"; exit 1; }
    - uv run python scripts/release_manifest.py build --version "${CI_COMMIT_TAG#v}" --ref "$CI_COMMIT_TAG" --image "$RELEASE_IMAGE" --channel next --notes-gitlab
    - uv run python scripts/release_manifest.py sign --key "$COSIGN_PRIVATE_KEY"
    - uv run python scripts/release_manifest.py verify --pubkey "$RELEASE_PUBKEY" --cosign
    - uv run python scripts/release_manifest.py publish --bucket "$RELEASE_BUCKET"
  artifacts:
    paths:
      - release-dist/
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $RELEASE_BUCKET && $COSIGN_PRIVATE_KEY

# Promote this tag's release to the stable channel: only channels/stable.json(.sig) change.
release:promote-stable:
  extends: .release-manifest
  needs: ["release:manifest"]
  script:
    - uv run python scripts/release_manifest.py fetch --bucket "$RELEASE_BUCKET" "releases/$CI_COMMIT_TAG.json" "releases/$CI_COMMIT_TAG.json.sig"
    - uv run python scripts/release_manifest.py promote --version "${CI_COMMIT_TAG#v}" --pubkey "$RELEASE_PUBKEY"
    - uv run python scripts/release_manifest.py sign --key "$COSIGN_PRIVATE_KEY" release-dist/channels/stable.json
    - uv run python scripts/release_manifest.py verify --pubkey "$RELEASE_PUBKEY" --cosign release-dist/channels/stable.json
    - uv run python scripts/release_manifest.py publish --bucket "$RELEASE_BUCKET" release-dist/channels/stable.json
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $RELEASE_BUCKET && $COSIGN_PRIVATE_KEY
      when: manual
