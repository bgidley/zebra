{% extends "layouts/bare.html" %}

{% block title %}Setup - Zebra{% endblock %}

{% block content %}
<div class="panel p-8">
    <h1 class="text-xl font-semibold text-ink mb-1">Welcome</h1>
    <p class="text-muted text-sm mb-6">Enter your display name to get started.</p>

    {% if error %}
    <div class="mb-4 p-3 rounded-md bg-red-900/50 border border-red-700 text-red-300 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/setup/">
        {% csrf_token %}
        <div class="mb-5">
            <label for="display_name" class="block text-sm font-medium text-gray-300 mb-1">
                Display name
            </label>
            <input
                type="text"
                id="display_name"
                name="display_name"
                autofocus
                required
                maxlength="255"
                placeholder="e.g. Ben"
                class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-md text-ink
                       placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-needs
                       focus:border-transparent text-sm"
            >
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center">Get started</button>
    </form>
</div>
{% endblock %}
