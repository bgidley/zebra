{% load icon_tags %}<a href="{{ url }}"
   class="group flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md
          {% if is_active %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
    {% if is_active %}
    {% icon icon class="h-5 w-5 shrink-0 text-indigo-400" %}
    {% else %}
    {% icon icon class="h-5 w-5 shrink-0 text-gray-400 group-hover:text-gray-300" %}
    {% endif %}
    {{ label }}
</a>
