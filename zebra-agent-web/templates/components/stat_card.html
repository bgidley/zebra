{% load icon_tags %}<a href="{{ href }}" class="bg-gray-800 rounded-lg p-6 hover:bg-gray-750 transition-colors border border-gray-700">
    <div class="flex items-center justify-between">
        <div>
            <p class="text-sm text-gray-400">{{ title }}</p>
            <p class="text-3xl font-bold text-white mt-1">{{ value }}</p>
        </div>
        <div class="p-3 rounded-lg {% if color == "amber" %}bg-amber-600{% elif color == "indigo" %}bg-indigo-600{% elif color == "blue" %}bg-blue-600{% elif color == "green" %}bg-green-600{% else %}bg-gray-600{% endif %}">
            {% icon icon class="h-6 w-6 text-white" %}
        </div>
    </div>
</a>
