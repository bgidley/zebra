##
## strfry config for Zebra's private sync relay (#246). See specs/commons-sync-relay-runbook.md.
## Installed to ~/.config/zebra-sync-relay/strfry.conf by hand; NOT installed by the deploy job.
##

db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    # SKILL events carry a whole workflow as NIP-44 ciphertext (base64): allow 128 KiB.
    maxEventSize = 131072
    rejectEventsNewerThanSeconds = 900
    # Certs from S1 and events queued during an outage can be old: keep the 3-year default.
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Inside the container; the Quadlet publishes it on 127.0.0.1:7778 only.
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
    realIpHeader = ""

    auth {
        # NIP-42. strfry asks for AUTH when a NIP-70 protected event (every SKILL) arrives.
        enabled = true
        # MUST be exactly the URL devices use (ZEBRA_SYNC_RELAY), e.g. wss://zebra.example.com/relay/sync
        serviceUrl = "wss://ZEBRA_HOST/relay/sync"
    }

    info {
        name = "zebra sync"
        description = "Private skill sync relay for one Zebra's own devices."
        pubkey = ""
        contact = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 262144
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        # Zebra's allow-list + receipt journal (write_policy.py, standard-library Python).
        plugin = "/etc/zebra-sync/write_policy.py"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = false
    }
}
