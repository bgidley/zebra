##
## strfry config for the public Zebra Commons relay (#231). See specs/commons-public-relay-runbook.md.
## Installed to ~/.config/zebra-commons-relay/strfry.conf by hand; NOT installed by the deploy job.
##

db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    # An OFFER carries a whole workflow's YAML (typically 2-20 KB): allow 128 KiB.
    maxEventSize = 131072
    rejectEventsNewerThanSeconds = 900
    # Certs from S1 and events queued during an outage can be old: keep the 3-year default.
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Inside the container; the Quadlet publishes it on 127.0.0.1:7779 only.
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
    realIpHeader = ""

    auth {
        # Public reads and writes: no NIP-42. The write policy limits what is stored.
        enabled = false
        serviceUrl = "wss://ZEBRA_HOST/commons"
    }

    info {
        name = "zebra commons"
        description = "Public Zebra Commons relay: workflow offers and their receipts."
        pubkey = ""
        contact = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 262144
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        # Public Commons kinds only + receipt journal (write_policy.py, standard-library Python).
        plugin = "/etc/zebra-commons/write_policy.py"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = false
    }
}
