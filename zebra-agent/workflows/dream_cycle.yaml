name: "Dream Cycle"
description: "Self-improvement cycle that analyzes performance, evaluates workflows, and optimizes the system"
tags: ["system", "optimization", "self-improvement", "dream"]
use_when: "Use this workflow periodically (e.g., daily) to review and improve the agent's capabilities"
version: 6
first_task: analyze_metrics

tasks:
  analyze_metrics:
    name: "Analyze Performance Metrics"
    action: metrics_analyzer
    auto: true
    properties:
      days_to_analyze: 7
      min_runs_for_analysis: 3
      output_key: metrics_analysis

  # Runs before load_workflows so the evaluator and optimizer only see the
  # active library. Thresholds come from ZEBRA_CURATOR_* env vars (#148).
  curate_workflows:
    name: "Retire Stale Workflows"
    action: workflow_curator
    auto: true
    properties:
      output_key: curation

  load_workflows:
    name: "Load Workflow Definitions"
    action: load_workflow_definitions
    auto: true
    properties:
      exclude_system: true
      output_key: workflow_definitions

  evaluate_workflows:
    name: "Evaluate Workflow Effectiveness"
    action: workflow_evaluator
    auto: true
    properties:
      metrics_analysis: "{{metrics_analysis}}"
      workflow_definitions: "{{workflow_definitions}}"
      output_key: evaluation

  optimize_workflows:
    name: "Optimize and Create Workflows"
    action: workflow_optimizer
    auto: true
    properties:
      evaluation: "{{evaluation}}"
      existing_workflows: "{{workflow_definitions}}"
      max_changes: 3
      dry_run: false
      output_key: optimization_results

  # Reviews each active user's personal knowledge against their runs since the
  # last dream cycle (#153). Never fails the cycle; human entries only change
  # through the contradiction / verification workflows it starts.
  review_knowledge:
    name: "Review Personal Knowledge"
    action: review_knowledge
    auto: true
    properties:
      lookback_days: 7
      max_users: 20
      max_runs_per_user: 20
      max_changes_per_user: 10
      output_key: knowledge_review

  generate_summary:
    name: "Generate Dream Cycle Summary"
    action: llm_call
    auto: true
    properties:
      system_prompt: |
        You are summarizing the results of a self-improvement cycle for an AI agent.
        Be concise but informative. Highlight key insights and actions taken.
      prompt: |
        ## Dream Cycle Results

        ### Metrics Analysis
        - Period: {{metrics_analysis.analysis_period_days}} days
        - Total runs analyzed: {{metrics_analysis.total_runs_analyzed}}
        - Unique workflows: {{metrics_analysis.unique_workflows}}

        Low performers: {{metrics_analysis.low_performers}}
        High performers: {{metrics_analysis.high_performers}}

        ### Evaluation Summary
        Overall health score: {{evaluation.overall_assessment.health_score}}/100
        Key issues: {{evaluation.overall_assessment.key_issues}}

        ### Optimization Results
        Changes made (validated and saved): {{optimization_results.changes_made}}
        New workflows created: {{optimization_results.new_workflows}}
        Modified workflows: {{optimization_results.modified_workflows}}
        Failed changes (rejected, NOT saved): {{optimization_results.failed_changes}}

        ### Library Curation (dry run: {{curation.dry_run}})
        Retired workflows (rule, reason, superseded_by): {{curation.retired}}
        Deferred to a later cycle (per-cycle cap): {{curation.deferred}}

        ### Continuations
        Continued goals in period: {{metrics_analysis.continuation_analysis.total_continuations}}
        Top continued workflows: {{metrics_analysis.continuation_analysis.top_continued}}
        Missing capabilities (needed a new workflow): {{metrics_analysis.continuation_analysis.capability_gaps}}
        Continuation-driven changes (status made/failed/skipped): {{optimization_results.continuation_changes}}

        ### Knowledge
        Users reviewed: {{knowledge_review.users_reviewed}} ({{knowledge_review.runs_reviewed}} runs)
        Counts (added, updated, stale_flagged, merged, reinforced, contradictions_proposed,
        verifications_proposed): {{knowledge_review.counts}}
        Examples: {{knowledge_review.examples}}
        Errors: {{knowledge_review.errors}}

        Provide a brief summary (3-5 sentences) of:
        1. Current system health
        2. Key improvements made — only those listed under "Changes made"
        3. Any failed changes and why they were rejected
        4. Continuations: how many goals were continued, the top continued workflows,
           and which continuation-driven changes were made (status "made" only)
        5. Library curation: which workflows were retired and why (only entries with
           applied true were retired; in a dry run, say what would be retired)
        6. Knowledge: entries added, updated, flagged stale, merged and reinforced (with
           examples), and how many changes to user-entered facts were sent to the user
           for confirmation instead of being applied
        7. Recommendations for future focus

        Never describe a failed change as applied or as having fixed anything.
      temperature: 0.5
      max_tokens: 900
      output_key: dream_summary

routings:
  - from: analyze_metrics
    to: curate_workflows
  - from: curate_workflows
    to: load_workflows
  - from: load_workflows
    to: evaluate_workflows
  - from: evaluate_workflows
    to: optimize_workflows
  - from: optimize_workflows
    to: review_knowledge
  - from: review_knowledge
    to: generate_summary
