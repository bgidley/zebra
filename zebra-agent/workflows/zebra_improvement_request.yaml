# Zebra Improvement Request (#189)
#
# Started by the dream cycle's propose_zebra_improvements step for a problem
# that needs a change to Zebra's own code (engine, task actions, web UI) rather
# than a workflow edit. The process properties are the record:
#
#   improvement            title, area, problem, evidence, suggested_change, impact
#   improvement_title      short title, used in headings and for dedupe
#   improvement_markdown   the request rendered for the reviewer
#   source_process_id      the Dream Cycle process that raised it
#
# The human task holds the request for review; its output
# (__task_output_review) is the verdict shown on /dreams/. file_issue then
# files an accepted request as a GitLab issue unless the reviewer linked one
# (#194); its result is filed_issue = {url, iid} | {skipped} | {error}.
#
# This workflow is a system workflow — the goal selector never picks it.

name: "Zebra Improvement Request"
version: 2
description: "Hold a dream-cycle request for an improvement to Zebra itself for human review."
tags: ["system", "improvement-request"]
use_when: "INTERNAL USE ONLY — started by the dream cycle"
first_task: review

tasks:
  review:
    name: "Review Improvement Request"
    auto: false
    properties:
      schema:
        type: object
        title: "Zebra improvement request"
        description: "{{improvement_title}}"
        required: [verdict]
        properties:
          request:
            type: string
            title: "Request"
            readOnly: true
            default: "{{improvement_markdown}}"
          verdict:
            type: string
            title: "Verdict"
            enum: [accepted, rejected, duplicate, later]
            enumLabels: ["Accept", "Reject", "Duplicate", "Later"]
          issue_url:
            type: string
            title: "Issue link"
            description: "Leave empty to have Zebra file a GitLab issue when you accept."
            format: url
          notes:
            type: string
            title: "Notes"
            description: "Added to the GitLab issue when Zebra files one."
            format: multiline

  file_issue:
    name: "File GitLab Issue"
    action: file_improvement_issue
    auto: true
    idempotent: true
    properties:
      output_key: filed_issue

routings:
  - from: review
    to: file_issue
