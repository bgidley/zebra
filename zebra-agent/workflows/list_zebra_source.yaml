name: "List Zebra Source"
description: >-
  List what is in Zebra's own deployed source: a directory's subdirectories (with file counts)
  and files (with sizes), or with a glob, every matching file path. Globs use * ? [..] and
  {a,b} alternatives, ** for any depth; a glob given as path lists by that glob. Deployed
  top-level entries: zebra-py/, zebra-tasks/, zebra-agent/, zebra-agent-web/, specs/, docs/,
  openspec/, scripts/, deploy/, pyproject.toml, version.json and the root *.md files.
tags: ["code", "source", "list"]
use_when: "You need to know which files or directories exist in Zebra's own codebase before reading one."
# v4 (#285): glob syntax documented, and a glob in path works. Replaces dream copy v3,
# which dropped the glob input.
version: 4
first_task: list
result_key: source
# Requires a path, so it is a tool for llm_agent and never selected for a goal (#190, #211).
inputs:
  type: object
  required: [path]
  properties:
    path:
      type: string
      description: "Directory relative to the repository root, e.g. zebra-tasks/zebra_tasks/agent, or '.' for the root; a glob here lists by that glob"
    glob:
      type: string
      description: "List matching files recursively instead, relative to the repository root, e.g. 'specs/**/*.md' or 'zebra-agent/tests/test_{skill,sync}*.py'"

tasks:
  list:
    name: "List source"
    action: zebra_source
    auto: true
    properties:
      operation: list
      path: "{{path}}"
      glob: "{{glob}}"
      max_results: 200
      output_key: source
