name: "Postmortem"
description: "Write a postmortem for a goal run that timed out, crashed or was rated badly, and store the lesson in long-term memory"
tags: ["agent", "internal", "system", "memory"]
use_when: "INTERNAL USE ONLY - started for timed-out / crashed goals and runs rated 1 or 2 (#175)"
version: 1
first_task: write_postmortem

# Started by zebra_agent.postmortem.start_postmortem with the run's goal,
# workflow_name, error, postmortem_trigger, run_id, rating, user_feedback and
# the failed run's __task_executions__ as process properties. Failed goal runs
# write their postmortem inside the Agent Main Loop instead.
tasks:
  write_postmortem:
    name: "Write Postmortem"
    action: write_postmortem
    auto: true
    properties:
      trigger: "{{postmortem_trigger}}"
      run_id: "{{run_id}}"
      goal: "{{goal}}"
      workflow_name: "{{workflow_name}}"
      error: "{{error}}"
      rating: "{{rating}}"
      user_feedback: "{{user_feedback}}"
      model: haiku
      output_key: postmortem

routings: []
