# Onboarding (#276, epic #275)
#
# The "get your own Zebra" wizard. Started only by the web's /onboarding/ page
# (zebra_agent_web.api.onboarding) for an anonymous visitor: one process per
# visitor, no account, no secrets. The process properties are the session state;
# the visitor's resume token is checked against __onboarding_nonce_sha256__.
#
# Every visitor step is `auto: false` with `external: onboarding_visitor`, so the
# process parks on it but it never shows in the owner's task inbox
# (zebra.forms.is_human_task). Each step carries what happens / what it costs /
# how to undo it, shown by the wizard before the visitor acts.
#
# A step the visitor reports as failed routes to its retry task, which shows the
# reason and loops back to the step; later steps stay locked until it is done.
#
# Access and callback (#278): `access` offers the published stack (option A) or,
# by the `policy` route, `access_policy` with the policy text for an admin
# (option B, no key upload). `provision` needs a one-time callback token; then
# `await_instance` (`external: onboarding_callback`) waits until the new instance
# calls POST /onboarding/callback/ and proves control of its URL
# (zebra_agent_web.api.onboarding_callback). `onboarding_panel` names the extra
# content the wizard renders for a step. See specs/onboarding-design.md.
#
# This is a system workflow: the goal selector never picks it, and the wizard
# starts it only while its content matches the shipped built-in.

name: "Onboarding"
version: 2
description: "Guide a visitor through getting their own Zebra in their own Oracle Cloud tenancy."
tags: ["system", "onboarding"]
use_when: "INTERNAL USE ONLY — started by the /onboarding/ wizard"
first_task: signup

tasks:
  signup:
    name: "Oracle Cloud account"
    auto: false
    properties:
      external: onboarding_visitor
      onboarding_step: signup
      onboarding_order: 1
      what_happens: >-
        You sign up for an Oracle Cloud (OCI) account, or use one you already have. Your Zebra
        will live in your own tenancy, not on this server.
      cost: >-
        Nothing. Zebra fits inside OCI's Always Free tier (2 OCPU / 12 GB Arm). Oracle asks for a
        card to verify you, but Always Free resources are not charged.
      undo: >-
        You can close an OCI account at any time from the OCI console. Nothing is created here.
      schema:
        type: object
        title: "Your Oracle Cloud account"
        description: "Sign up at https://signup.cloud.oracle.com/ (or sign in), then tell us your home region."
        required: [home_region]
        properties:
          home_region:
            type: string
            title: "Home region"
            description: "Shown in the OCI console's top bar. London is the default."
            enum: [uk-london-1, eu-frankfurt-1, eu-amsterdam-1, us-ashburn-1, us-phoenix-1, other]
            enumLabels: ["UK South (London) uk-london-1", "Germany Central (Frankfurt) eu-frankfurt-1", "Netherlands Northwest (Amsterdam) eu-amsterdam-1", "US East (Ashburn) us-ashburn-1", "US West (Phoenix) us-phoenix-1", "Another region"]
            default: uk-london-1
          problem:
            type: string
            title: "Something went wrong?"
            description: "Only if you are stuck: what happened, in your own words. Never paste passwords or keys."
            format: multiline
            maxLength: 2000

  signup_retry:
    name: "Oracle Cloud account: try again"
    auto: false
    properties: &retry
      external: onboarding_visitor
      onboarding_step: signup
      onboarding_retry: true
      show_prior_outputs: false
      schema:
        type: object
        title: "This step did not finish"
        properties:
          reason:
            type: string
            title: "What went wrong"
            readOnly: true
            default: "{{__task_output_signup.problem}}"

  access:
    name: "Give access"
    auto: false
    properties:
      external: onboarding_visitor
      onboarding_step: access
      onboarding_order: 2
      # The wizard renders the access panel (deploy link, tenancy-admin note, revoke link):
      # zebra_agent_web.api.onboarding_access
      onboarding_panel: access
      what_happens: >-
        You let a published Oracle Resource Manager stack build Zebra in one compartment of your
        tenancy. You apply it yourself; this server never holds a key to your tenancy.
      cost: >-
        Nothing: the stack creates Always Free resources only.
      undo: >-
        Destroy the stack in Resource Manager and delete its compartment (see "How to undo
        everything").
      schema:
        type: object
        title: "Give access"
        description: >-
          Choose how your Zebra gets built. The stack is the simple path; if you cannot use
          Resource Manager, show your administrator the exact policy it needs instead.
        properties:
          name:
            type: string
            title: "A short name for your Zebra"
            description: "Lower-case letters, digits and dashes. Used in the policy text, e.g. zebra-mine."
            pattern: "^[a-z][a-z0-9-]{0,19}$"
            maxLength: 20
            default: "mine"
          problem:
            type: string
            title: "Something went wrong?"
            format: multiline
            maxLength: 2000

  access_policy:
    name: "Give access"
    auto: false
    properties:
      external: onboarding_visitor
      onboarding_step: access
      # The policy text (one compartment; tenancy-level and runtime grants separate)
      onboarding_panel: policy
      what_happens: >-
        Your tenancy administrator creates a group and a policy limited to one compartment, then
        you apply the stack yourself. Nothing is uploaded here: no key, no password.
      cost: "Nothing."
      undo: >-
        Delete the group and its policies, destroy the stack and delete the compartment.
      schema:
        type: object
        title: "The policy for your administrator"
        description: "Copy the text below to your tenancy administrator. Continue once it is in place."
        properties: {}

  access_retry:
    name: "Give access: try again"
    auto: false
    properties:
      <<: *retry
      onboarding_step: access
      schema:
        type: object
        title: "This step did not finish"
        properties:
          reason:
            type: string
            title: "What went wrong"
            readOnly: true
            default: "{{__task_output_access.problem}}"

  provision:
    name: "Build your Zebra"
    auto: false
    properties:
      external: onboarding_visitor
      onboarding_step: provision
      onboarding_order: 3
      # The provision panel: make the one-time callback token, open the stack
      onboarding_panel: provision
      onboarding_needs_token: true
      what_happens: >-
        You make a one-time token here and paste it into the stack's onboarding_token field.
        The stack creates a small Arm instance and an Autonomous Database in your compartment and
        installs Zebra on it; on first boot your Zebra uses the token to tell this wizard where
        it is.
      cost: >-
        Nothing on Always Free shapes. Your own LLM key (OpenRouter) is set on your new Zebra, not
        here, and its spend is yours.
      undo: >-
        Destroy the stack; every resource it made is removed. The token expires after an hour.
      schema:
        type: object
        title: "Build your Zebra"
        description: "Make your token, open the stack, paste the token and run Apply."
        required: [applied]
        properties:
          applied:
            type: boolean
            title: "I pasted my token into the stack and started Apply"
          problem:
            type: string
            title: "Something went wrong?"
            format: multiline
            maxLength: 2000

  await_instance:
    name: "Wait for your Zebra to call home"
    auto: false
    properties:
      # Completed by POST /onboarding/callback/ (or the visitor's manual paste), both after
      # the control proof: zebra_agent_web.api.onboarding_callback
      external: onboarding_callback
      onboarding_step: provision
      onboarding_panel: await

  await_instance_retry:
    name: "Build your Zebra: try again"
    auto: false
    properties:
      <<: *retry
      onboarding_step: provision
      schema:
        type: object
        title: "This step did not finish"
        properties:
          reason:
            type: string
            title: "What went wrong"
            readOnly: true
            default: "{{__task_output_await_instance.problem}}"

  provision_retry:
    name: "Build your Zebra: try again"
    auto: false
    properties:
      <<: *retry
      onboarding_step: provision
      schema:
        type: object
        title: "This step did not finish"
        properties:
          reason:
            type: string
            title: "What went wrong"
            readOnly: true
            default: "{{__task_output_provision.problem}}"

  verify:
    name: "Check it works"
    auto: false
    properties:
      external: onboarding_visitor
      onboarding_step: verify
      onboarding_order: 4
      what_happens: >-
        You open your new Zebra and check it answers. Later releases check this for you.
      cost: "Nothing."
      undo: "Nothing to undo."
      schema:
        type: object
        title: "Check it works"
        required: [working]
        properties:
          instance_url:
            type: string
            title: "Your new Zebra"
            readOnly: true
            default: "{{__task_output_await_instance.instance_url}}"
          working:
            type: boolean
            title: "My new Zebra's page loads and I can sign in"
          problem:
            type: string
            title: "Something went wrong?"
            format: multiline
            maxLength: 2000

  verify_retry:
    name: "Check it works: try again"
    auto: false
    properties:
      <<: *retry
      onboarding_step: verify
      schema:
        type: object
        title: "This step did not finish"
        properties:
          reason:
            type: string
            title: "What went wrong"
            readOnly: true
            default: "{{__task_output_verify.problem}}"

  commons:
    name: "Join the Commons"
    auto: false
    properties:
      external: onboarding_visitor
      onboarding_step: commons
      onboarding_order: 5
      what_happens: >-
        Optionally, your Zebra makes its own Commons identity so it can share and receive
        workflows. Its keys are made on your Zebra and never leave it.
      cost: "Nothing."
      undo: "Turn the Commons off on your Zebra; you can revoke its devices at any time."
      schema:
        type: object
        title: "Join the Commons"
        properties:
          join:
            type: boolean
            title: "I want my Zebra to join the Commons"
          problem:
            type: string
            title: "Something went wrong?"
            format: multiline
            maxLength: 2000

  commons_retry:
    name: "Join the Commons: try again"
    auto: false
    properties:
      <<: *retry
      onboarding_step: commons
      schema:
        type: object
        title: "This step did not finish"
        properties:
          reason:
            type: string
            title: "What went wrong"
            readOnly: true
            default: "{{__task_output_commons.problem}}"

  contribute:
    name: "Contribute"
    auto: false
    properties:
      external: onboarding_visitor
      onboarding_step: contribute
      onboarding_order: 6
      what_happens: >-
        Optionally, learn how improvements your Zebra makes can be offered back to Zebra on
        GitHub. Nothing is sent without your review.
      cost: "Nothing."
      undo: "Close any pull request you opened."
      schema:
        type: object
        title: "Contribute"
        properties:
          interested:
            type: boolean
            title: "Tell me how to contribute improvements back"
          problem:
            type: string
            title: "Something went wrong?"
            format: multiline
            maxLength: 2000

  contribute_retry:
    name: "Contribute: try again"
    auto: false
    properties:
      <<: *retry
      onboarding_step: contribute
      schema:
        type: object
        title: "This step did not finish"
        properties:
          reason:
            type: string
            title: "What went wrong"
            readOnly: true
            default: "{{__task_output_contribute.problem}}"

  finished:
    name: "All done"

routings:
  - {from: signup, to: access, condition: route_name, name: done}
  - {from: signup, to: signup_retry, condition: route_name, name: problem}
  - {from: signup_retry, to: signup}
  - {from: access, to: provision, condition: route_name, name: done}
  - {from: access, to: access_retry, condition: route_name, name: problem}
  - {from: access_retry, to: access}
  - {from: access, to: access_policy, condition: route_name, name: policy}
  - {from: access_policy, to: provision, condition: route_name, name: done}
  - {from: access_policy, to: access, condition: route_name, name: back}
  - {from: provision, to: await_instance, condition: route_name, name: done}
  - {from: await_instance, to: verify, condition: route_name, name: done}
  - {from: await_instance, to: await_instance_retry, condition: route_name, name: problem}
  - {from: await_instance_retry, to: provision}
  - {from: provision, to: provision_retry, condition: route_name, name: problem}
  - {from: provision_retry, to: provision}
  - {from: verify, to: commons, condition: route_name, name: done}
  - {from: verify, to: verify_retry, condition: route_name, name: problem}
  - {from: verify_retry, to: verify}
  - {from: commons, to: contribute, condition: route_name, name: done}
  - {from: commons, to: commons_retry, condition: route_name, name: problem}
  - {from: commons_retry, to: commons}
  - {from: contribute, to: finished, condition: route_name, name: done}
  - {from: contribute, to: contribute_retry, condition: route_name, name: problem}
  - {from: contribute_retry, to: contribute}
